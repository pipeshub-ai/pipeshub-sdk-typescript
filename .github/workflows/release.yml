name: Release to npm & GitHub

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version from .speakeasy/gen.yaml
        id: version
        run: |
          VERSION=$(python3 -c "import yaml; data=yaml.safe_load(open('.speakeasy/gen.yaml')); print(data['typescript']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@pipeshub-ai'

      # Workflow-only: links the GitHub Packages copy to the main repo without changing the Speakeasy-generated package.json or the npmjs.com metadata.
      - name: Point package repository at the main repo
        run: |
          npm pkg set repository.type=git
          npm pkg set repository.url=git+https://github.com/pipeshub-ai/pipeshub-ai.git

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
